<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quotation Request - Moustapha Daher Center</title>
    <link rel="stylesheet" href="./style.css">
</head>
<body>
    <header>
       <div class="logo-area">
            <!-- Logo image replacing the text title -->
            <a href="index.html">
                <img src="logo.png" alt="Moustapha Daher Center - Water Technologies Experts" class="site-logo">
            </a>
        </div>
        <!-- Circular Image Showcase Gallery -->
        <div class="header-circles-container">
            <div class="circle-item"><img src="image1.jpg" alt="Water Technology 1"></div>
            <div class="circle-item"><img src="image2.jpg" alt="Water Technology 2"></div>
            <div class="circle-item"><img src="image3.jpg" alt="Water Technology 3"></div>
            <div class="circle-item"><img src="image4.jpg" alt="Water Technology 4"></div>
            <div class="circle-item"><img src="image5.jpg" alt="Water Technology 5"></div>
            <div class="circle-item"><img src="image6.jpg" alt="Water Technology 6"></div>
            <div class="circle-item"><img src="image7.jpg" alt="Water Technology 7"></div>
        </div>
        <nav>
            <ul>
                <li><a href="index.html">About Us</a></li>
                <li><a href="services.html">Services</a></li>
                <li><a href="products.html">Products</a></li>
                <li><a href="projects.html">Projects</a></li>
                <li><a href="feedback.html">Clients Feedback</a></li>
                <li><a href="quotation.html" class="active">Quotation Request</a></li>
                <li><a href="contact.html">Contact Us</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section class="content-section">
        <h2 class="section-title">Quotation Request Form</h2>
        <form class="contact-form">
            <label>First Name: <input type="text" name="firstname"></label>
            <label>Last Name: <input type="text" name="lastname"></label>
            <label>Company Name: <input type="text" name="company"></label>
            <label>Requested Service: <input type="text" name="service"></label>
            <label>Requested Product: <input type="text" name="product"></label>
            <label>Technical Specifications: <textarea name="specs"></textarea></label>
            <label>Expected Delivery Date: <input type="date" name="deliverydate"></label>
            <label>Mobile: <input type="tel" name="mobile"></label>
            <label>Tel.: <input type="tel" name="tel"></label>
            <label>Email: <input type="email" name="email"></label>
            <label>Address: <input type="text" name="address"></label>
            <div class="form-buttons">
                <button type="reset">Reset</button>
                <button type="submit">Send</button>
                <button type="button">WhatsApp</button>
            </div>
        </form>
        </section>
    </main>

    <footer>
        <p>Tel: +961 7 220 181 | Mobile: +961 3 581 180, +961 70 581 180 | info@dahercenter.com | www.dahercenter.com.lb</p>
    </footer>
</body>
</html>
